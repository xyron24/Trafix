gateway:
  services:
    - name: "web-service"
      listen_port: 8081
      backends:
        - host: "127.0.0.1"
          port: 3005
        - host: "127.0.0.1"
          port: 3002
        - host: "127.0.0.1"
          port: 3003
    - name: "api-service"
      listen_port: 8443
      backends:
        - host: "127.0.0.1"
          port: 4001
        - host: "127.0.0.1"
          port: 4002
        - host: "127.0.0.1"
          port: 4003